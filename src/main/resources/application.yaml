spring:
  application:
    name: razorpay
  datasource:
    url: jdbc:postgresql://localhost:5432/razorpayDB
    username: postgres
    password: showdata
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: 8081

vault:
  master-key: asdfw3492r8falldj234988aoasd

payment:
  simulator:
    poll-interval-ms : 5000
    chaos-mode : NORMAL   // SUCCESS, SLOW, TIMEOUT, FAILURE
    method:
      CARD:
        min-delay-seconds: 2
        max-delay-seconds: 6
        success-rate: 90
      UPI:
        min-delay-seconds: 2
        max-delay-seconds: 6
        success-rate: 90
      NET_BANKING:
        min-delay-seconds: 2
        max-delay-seconds: 6
        success-rate: 90
